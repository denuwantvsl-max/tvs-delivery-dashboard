<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light" />
<title>TVS Lanka — Delivery &amp; Stock Dashboard</title>
<style>
/* ==================================================================
   TVS LANKA — HORANA ASSEMBLY COMPLEX
   Delivery & Stock Dashboard — scroll-narrative edition
   House style: navy / white, industrial, hairline rules, square edges.
   No external assets. Everything below is self-contained.
   ================================================================== */

@property --r { syntax: "<number>"; inherits: false; initial-value: 0; }

:root{
  --navy-950:#08131F;
  --navy-900:#0F2138;
  --navy-800:#152C48;
  --navy-700:#1B3A5C;
  --navy-600:#26507C;
  --steel:#5C7286;
  --steel-2:#8CA0B3;
  --paper:#F2F5F8;
  --panel:#FFFFFF;
  --line:#DCE2E8;
  --line-dark:rgba(255,255,255,.14);
  --amber:#D98E2B;
  --green:#2F8F5B;
  --red:#C0392B;
  --chrome:104px;
  --runway:300vh;
  --pad:clamp(20px,5vw,56px);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

*,*::before,*::after{ box-sizing:border-box; }

html{ scroll-behavior:auto; background:var(--paper); }
body{
  margin:0;
  background:var(--paper);
  color:var(--navy-900);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}

.num{ font-variant-numeric:tabular-nums lining-nums; font-feature-settings:"tnum" 1; }
.wrap{ max-width:1280px; margin:0 auto; padding-inline:var(--pad); width:100%; }

/* ---------- chrome: masthead + tab rail ---------- */
.masthead{
  position:sticky; top:0; z-index:60;
  background:var(--navy-950);
  color:#fff;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.masthead-in{
  display:flex; align-items:center; justify-content:space-between;
  gap:16px; flex-wrap:wrap;
  padding-block:14px;
}
.brand{ display:flex; align-items:center; gap:14px; min-width:0; }
.brand-mark{
  width:34px; height:34px; flex:none;
  border:1.5px solid var(--amber);
  display:grid; place-items:center;
  font-size:12px; font-weight:800; letter-spacing:.06em; color:var(--amber);
}
.brand-txt .t{ font-size:15px; font-weight:650; letter-spacing:.01em; }
.brand-txt .s{
  font-size:10.5px; letter-spacing:.16em; text-transform:uppercase;
  color:#7E93A8; margin-top:3px;
}
.chrome-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.asof{
  border:1px solid var(--line-dark);
  padding:7px 13px;
  font-size:12px; color:#C6D4E2;
  letter-spacing:.02em;
}
.asof b{ color:#fff; font-weight:650; }
.live{
  display:inline-flex; align-items:center; gap:7px;
  font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:#7FD8A3;
  border:1px solid rgba(127,216,163,.28); padding:7px 11px;
}
.live .dot{
  width:7px; height:7px; border-radius:50%; background:#3DDB7F;
  animation:pulse 2.4s ease-out infinite;
}
.live.stale{ color:#E8B95F; border-color:rgba(232,185,95,.3); }
.live.stale .dot{ background:var(--amber); animation:none; }
.live.err{ color:#EF8C7E; border-color:rgba(239,140,126,.35); }
.live.demo{ color:#9DB8D6; border-color:rgba(157,184,214,.3); }
.live.demo .dot{ background:#7FA8D4; animation:none; }
.live.err .dot{ background:var(--red); animation:none; }
@keyframes pulse{
  0%{ box-shadow:0 0 0 0 rgba(61,219,127,.55); }
  70%{ box-shadow:0 0 0 8px rgba(61,219,127,0); }
  100%{ box-shadow:0 0 0 0 rgba(61,219,127,0); }
}

.tabrail{
  position:sticky; top:var(--mast,56px); z-index:59;
  background:var(--navy-800);
  border-bottom:1px solid rgba(255,255,255,.07);
}
.tabrail-in{ display:flex; gap:0; overflow-x:auto; scrollbar-width:none; }
.tabrail-in::-webkit-scrollbar{ display:none; }
.tabbtn{
  appearance:none; background:none; border:none;
  color:#9DB2C6; cursor:pointer;
  padding:15px 22px 13px;
  font:inherit; font-size:12px; font-weight:700;
  letter-spacing:.13em; text-transform:uppercase;
  white-space:nowrap;
  border-bottom:2px solid transparent;
  transition:color .18s ease, border-color .18s ease;
}
.tabbtn:first-child{ padding-left:0; }
.tabbtn:hover{ color:#E4EDF5; }
.tabbtn[aria-selected="true"]{ color:#fff; border-bottom-color:var(--amber); }
.tabbtn:focus-visible{ outline:2px solid var(--amber); outline-offset:-2px; }

/* ---------- views ---------- */
body.booting .view{ display:none; }
body:not(.booting) #bootState{ display:none; }
.view{ display:none; }
.view.active{ display:block; }

/* ---------- hero ---------- */
.hero{
  background:var(--navy-950);
  color:#fff;
  min-height:calc(100vh - var(--chrome));
  display:flex; align-items:center;
  position:relative;
  overflow:hidden;
  padding-block:clamp(56px,10vh,110px);
}
.hero::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.028) 0 1px,transparent 1px 88px),
    radial-gradient(120% 80% at 82% 12%,rgba(38,80,124,.55),transparent 62%);
}
.hero-in{ position:relative; z-index:1; width:100%; }
.kicker{
  font-size:10.5px; font-weight:700; letter-spacing:.22em; text-transform:uppercase;
  color:var(--amber);
  display:flex; align-items:center; gap:12px;
}
.kicker::after{ content:""; height:1px; flex:1; max-width:220px; background:rgba(217,142,43,.4); }
.hero h1{
  margin:22px 0 0;
  font-size:clamp(38px,7.2vw,86px);
  line-height:1.02;
  letter-spacing:-.035em;
  font-weight:680;
  max-width:16ch;
}
.hero h1 em{ font-style:normal; color:#7FA8D4; }
.hero-date{
  margin-top:26px;
  font-size:clamp(14px,1.6vw,17px);
  color:#A9BFD3;
  letter-spacing:.01em;
}
.hero-date b{ color:#fff; font-weight:600; }

.statrow{
  margin-top:clamp(38px,6vh,72px);
  display:grid; gap:1px;
  grid-template-columns:repeat(3,1fr);
  background:var(--line-dark);
  border-block:1px solid var(--line-dark);
}
.stat{ background:var(--navy-950); padding:26px 26px 24px; }
.stat:first-child{ padding-left:0; }
.stat .lbl{
  font-size:10px; font-weight:700; letter-spacing:.18em; text-transform:uppercase;
  color:#7E93A8;
}
.stat .val{
  margin-top:12px;
  font-size:clamp(34px,5.2vw,62px);
  line-height:1; letter-spacing:-.035em; font-weight:640;
  color:#fff;
}
.stat .val.g{ color:#63D398; }
.stat .val.a{ color:#F0B761; }
.stat .val.r{ color:#F58E7F; }
.stat .sub{ margin-top:10px; font-size:12px; color:#7E93A8; letter-spacing:.02em; }

.scrollcue{
  margin-top:clamp(34px,5vh,60px);
  display:inline-flex; align-items:center; gap:11px;
  font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:#7E93A8;
}
.scrollcue i{
  width:15px; height:15px; border-right:1.5px solid var(--amber); border-bottom:1.5px solid var(--amber);
  transform:rotate(45deg); display:block;
  animation:cue 2.1s ease-in-out infinite;
}
@keyframes cue{ 0%,100%{ transform:rotate(45deg) translate(0,0); opacity:.45 } 50%{ transform:rotate(45deg) translate(4px,4px); opacity:1 } }

/* ---------- reveal engine ---------- */
.r{
  opacity:var(--r,0);
  transform:translateY(calc(24px * (1 - var(--r,0))));
  will-change:opacity,transform;
}
.r.no-shift{ transform:none; }
.hr{
  opacity:var(--r,0);
  transform:translateY(calc(20px * (1 - var(--r,0))));
  transition:--r .85s cubic-bezier(.22,.61,.36,1);
  transition-delay:calc(var(--i,0) * 90ms);
}
.hr.in{ --r:1; }
@keyframes revealK{ from{ --r:0 } to{ --r:1 } }
@keyframes pinOutK{
  from{ opacity:1; transform:none; }
  to{ opacity:0; transform:translateY(-26px) scale(.985); }
}

/* fallback path (no scroll-driven animations): class-triggered */
.fallback .r{ transition:--r .8s cubic-bezier(.22,.61,.36,1); transition-delay:calc(var(--i,0) * 70ms); }
.fallback .r.in{ --r:1; }
/* last-resort: no @property support at all — show everything */
.no-anim .r,.no-anim .hr{ --r:1; opacity:1; transform:none; transition:none; animation:none; }

/* ---------- chapters (pinned scroll storytelling) ---------- */
.chapter{
  position:relative;
  height:var(--runway);
  background:var(--paper);
}
.chapter.dark{ background:var(--navy-900); color:#fff; }
.pin{
  position:sticky; top:var(--chrome);
  height:calc(100vh - var(--chrome));
  min-height:520px;
  display:flex; align-items:center;
  overflow:hidden;
}
.pin-in{ width:100%; }
.chapter-grid{
  display:grid;
  grid-template-columns:minmax(0,0.9fr) minmax(0,1.1fr);
  gap:clamp(28px,5vw,72px);
  align-items:center;
}
.chapter h2{
  margin:18px 0 0;
  font-size:clamp(34px,5.6vw,68px);
  line-height:1.02; letter-spacing:-.035em; font-weight:660;
}
.chapter .lede{
  margin-top:16px; max-width:38ch;
  font-size:clamp(14px,1.5vw,17px); line-height:1.55; color:var(--steel);
}
.chapter.dark .lede{ color:#9DB2C6; }
.idx{
  font-variant-numeric:tabular-nums;
  color:var(--steel-2); font-weight:700;
}
.chapter.dark .idx{ color:#5C7286; }

/* kpi trio inside a chapter */
.kpis{
  margin-top:clamp(26px,4vh,44px);
  display:grid; grid-template-columns:repeat(3,minmax(0,1fr));
  gap:1px; background:var(--line);
  border-block:1px solid var(--line);
}
.chapter.dark .kpis{ background:var(--line-dark); border-color:var(--line-dark); }
.kpi{ background:var(--paper); padding:18px 18px 16px; }
.kpi:first-child{ padding-left:0; }
.chapter.dark .kpi{ background:var(--navy-900); }
.kpi .lbl{
  font-size:9.5px; font-weight:700; letter-spacing:.17em; text-transform:uppercase; color:var(--steel);
}
.chapter.dark .kpi .lbl{ color:#7E93A8; }
.kpi .val{
  margin-top:9px; font-size:clamp(26px,3.4vw,42px); line-height:1;
  letter-spacing:-.032em; font-weight:640;
}
.kpi .val.g{ color:var(--green); }
.kpi .val.a{ color:var(--amber); }
.kpi .val.r{ color:var(--red); }
.chapter.dark .kpi .val.g{ color:#63D398; }
.chapter.dark .kpi .val.a{ color:#F0B761; }
.chapter.dark .kpi .val.r{ color:#F58E7F; }
.kpi .foot{ margin-top:8px; font-size:11px; color:var(--steel-2); letter-spacing:.02em; }

/* completion meter */
.meter{ margin-top:26px; }
.meter-head{
  display:flex; justify-content:space-between; align-items:baseline;
  font-size:10.5px; font-weight:700; letter-spacing:.17em; text-transform:uppercase;
  color:var(--steel);
}
.chapter.dark .meter-head{ color:#7E93A8; }
.meter-head .pct{
  font-size:15px; letter-spacing:-.01em; color:var(--navy-900); font-weight:700;
}
.chapter.dark .meter-head .pct{ color:#fff; }
.meter-track{
  margin-top:10px; height:10px; background:var(--line); position:relative; overflow:hidden;
}
.chapter.dark .meter-track{ background:rgba(255,255,255,.1); }
.meter-fill{
  position:absolute; inset-block:0; left:0;
  width:calc(var(--w,0) * var(--r,0) * 1%);
  background:var(--green);
}
.meter-fill.over{ background:var(--amber); }

/* right-hand data column */
.datacol{ min-width:0; }
.datacol-head{
  display:flex; align-items:baseline; justify-content:space-between; gap:12px;
  font-size:10px; font-weight:700; letter-spacing:.18em; text-transform:uppercase;
  color:var(--steel);
  padding-bottom:11px; border-bottom:1px solid var(--line);
}
.chapter.dark .datacol-head{ color:#7E93A8; border-color:var(--line-dark); }

.linerow{
  display:grid;
  grid-template-columns:minmax(120px,1.35fr) minmax(0,2fr) 62px;
  align-items:center; gap:16px;
  padding:11px 0;
  border-bottom:1px solid var(--line);
}
.chapter.dark .linerow{ border-color:var(--line-dark); }
.linerow:last-child{ border-bottom:none; }
.linerow .name{ min-width:0; }
.linerow .name .m{ font-size:13.5px; font-weight:640; letter-spacing:-.005em; display:block;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.linerow .name .c{ font-size:11px; color:var(--steel-2); letter-spacing:.03em; margin-top:2px; display:block;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.linerow .qty{ text-align:right; font-size:14px; font-weight:700; letter-spacing:-.01em; }
.linerow .qty.a{ color:var(--amber); }
.linerow .qty.r{ color:var(--red); }
.bar{ height:9px; background:var(--line); position:relative; overflow:hidden; }
.chapter.dark .bar{ background:rgba(255,255,255,.1); }
.bar span{
  position:absolute; inset-block:0; left:0;
  width:calc(var(--w,0) * var(--r,0) * 1%);
  background:var(--c,var(--green));
}

.more-note{
  margin-top:14px; font-size:11.5px; color:var(--steel-2); letter-spacing:.04em;
}

/* ---------- trend chart ---------- */
.legend{
  display:flex; gap:18px; flex-wrap:wrap;
  font-size:10.5px; font-weight:600; letter-spacing:.12em; text-transform:uppercase;
  color:var(--steel); margin-bottom:14px;
}
.chapter.dark .legend{ color:#9DB2C6; }
.legend span{ display:inline-flex; align-items:center; gap:7px; }
.legend i{ width:14px; height:2.5px; display:inline-block; }
svg.trend{ display:block; width:100%; height:auto; overflow:visible; }
svg.trend .grid{ stroke:var(--line); stroke-width:1; }
.chapter.dark svg.trend .grid{ stroke:rgba(255,255,255,.11); }
svg.trend .axlbl{ font-size:10px; fill:var(--steel-2); font-family:var(--sans); letter-spacing:.04em; }
.chapter.dark svg.trend .axlbl{ fill:#6F8598; }
svg.trend .spark{
  fill:none; stroke-width:2.25; stroke-linecap:round; stroke-linejoin:round;
  stroke-dasharray:var(--len,2000);
  stroke-dashoffset:calc(var(--len,2000) * (1 - var(--r,0)));
}
svg.trend .area{ stroke:none; opacity:calc(var(--r,0) * .11); }
svg.trend .tip{ opacity:var(--r,0); }

/* ---------- ledger (full table under each chapter) ---------- */
.ledger{ background:var(--panel); border-top:1px solid var(--line); padding-block:clamp(46px,7vh,86px); }
.ledger-head{
  display:flex; align-items:baseline; justify-content:space-between; gap:14px; flex-wrap:wrap;
  padding-bottom:12px; border-bottom:2px solid var(--navy-900);
}
.ledger-head h3{
  margin:0; font-size:13px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
}
.ledger-head .tag{
  font-size:10.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--steel);
}
.tablescroll{ overflow-x:auto; }
table{ width:100%; border-collapse:collapse; font-size:13.5px; min-width:520px; }
thead th{
  text-align:left; padding:11px 14px 10px;
  font-size:9.5px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
  color:var(--steel); border-bottom:1px solid var(--line); white-space:nowrap;
}
thead th.n, td.n{ text-align:right; }
tbody td{ padding:10px 14px; border-bottom:1px solid var(--line); }
tbody tr:hover{ background:#F7F9FB; }
tbody td:first-child{ padding-left:0; font-weight:600; }
thead th:first-child{ padding-left:0; }
tbody td.dim{ color:var(--steel); font-size:12.5px; }
td.n{ font-weight:650; letter-spacing:-.01em; }
td.n.a{ color:var(--amber); }
td.n.r{ color:var(--red); }
td.n.g{ color:var(--green); }

/* ---------- states ---------- */
.state{
  min-height:60vh; display:flex; align-items:center; justify-content:center;
  text-align:center; padding:60px 20px;
}
.state .box{ max-width:560px; }
.state .k{
  font-size:10.5px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:var(--amber);
}
.state h4{ margin:14px 0 10px; font-size:22px; font-weight:640; letter-spacing:-.02em; }
.state p{ margin:0; color:var(--steel); font-size:14px; line-height:1.6; }
.state code{
  display:inline-block; margin-top:14px; font-size:12px;
  background:var(--paper); border:1px solid var(--line); padding:7px 11px;
  word-break:break-all; color:var(--navy-700);
}
.empty{ padding:34px 0; color:var(--steel-2); font-size:13.5px; letter-spacing:.02em; }

footer{
  background:var(--navy-950); color:#6F8598;
  font-size:11px; letter-spacing:.11em; text-transform:uppercase;
  padding-block:26px;
}
footer .wrap{ display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; }

/* ---------- native CSS scroll-driven animation path ---------- */
@supports (animation-timeline: view()){
  .chapter{
    view-timeline-name:--ch;
    view-timeline-axis:block;
    view-timeline-inset:var(--chrome) 0px;
  }
  .r{
    animation:revealK linear both;
    animation-timeline:--ch;
    animation-range:contain calc(1% + var(--i,0) * 4.5%) contain calc(24% + var(--i,0) * 4.5%);
  }
  .r.slow{ animation-range:contain 4% contain 46%; }
  .r.late{ animation-range:contain 30% contain 62%; }
  .pin-in{
    animation:pinOutK linear both;
    animation-timeline:--ch;
    animation-range:contain 88% contain 100%;
  }
}

/* ---------- responsive ---------- */
@media (max-width:900px){
  :root{ --runway:260vh; }
  .chapter-grid{ grid-template-columns:1fr; gap:26px; align-items:start; }
  .pin{ align-items:flex-start; padding-top:26px; overflow-y:auto; }
  .kpi{ padding:14px 12px; }
  .statrow{ grid-template-columns:1fr; }
  .stat{ padding:20px 0; }
  .stat:first-child{ padding-top:22px; }
  .linerow{ grid-template-columns:minmax(90px,1fr) minmax(0,1.4fr) 52px; gap:11px; }
}
@media (max-width:560px){
  :root{ --runway:230vh; --chrome:96px; }
  .brand-mark{ display:none; }
  .tabbtn{ padding:13px 15px 11px; letter-spacing:.1em; }
  .pin{ min-height:0; }
}

/* ---------- accessibility: motion off ---------- */
@media (prefers-reduced-motion: reduce){
  .chapter{ height:auto; }
  .pin{ position:static; height:auto; min-height:0; padding-block:clamp(50px,9vh,90px); overflow:visible; }
  .r,.hr{ --r:1 !important; opacity:1 !important; transform:none !important;
          animation:none !important; transition:none !important; }
  .live .dot,.scrollcue i{ animation:none; }
  svg.trend .spark{ stroke-dashoffset:0 !important; }
}
@media print{
  .chapter{ height:auto; } .pin{ position:static; height:auto; }
  .r,.hr{ --r:1; opacity:1; transform:none; }
}
</style>
</head>
<body>

<header class="masthead">
  <div class="wrap masthead-in">
    <div class="brand">
      <div class="brand-mark">TVS</div>
      <div class="brand-txt">
        <div class="t">Delivery &amp; Stock Dashboard</div>
        <div class="s">Horana Assembly Complex</div>
      </div>
    </div>
    <div class="chrome-right">
      <div class="asof">As of <b id="asOfDate">—</b></div>
      <div class="live" id="liveBadge"><span class="dot"></span> <span id="liveTxt">Live</span></div>
    </div>
  </div>
</header>

<nav class="tabrail" aria-label="Dashboard sections">
  <div class="wrap tabrail-in" role="tablist">
    <button class="tabbtn" role="tab" id="tab-status"   aria-selected="true"  aria-controls="view-status"   data-view="status">Delivery Status</button>
    <button class="tabbtn" role="tab" id="tab-shortage" aria-selected="false" aria-controls="view-shortage" data-view="shortage">Shortage</button>
    <button class="tabbtn" role="tab" id="tab-trend"    aria-selected="false" aria-controls="view-trend"    data-view="trend">Trend</button>
  </div>
</nav>

<main id="main">

  <section class="view active" id="view-status" role="tabpanel" aria-labelledby="tab-status">
    <div class="hero" data-hero="status"></div>
    <div class="story" id="story-status"></div>
  </section>

  <section class="view" id="view-shortage" role="tabpanel" aria-labelledby="tab-shortage">
    <div class="hero" data-hero="shortage"></div>
    <div class="story" id="story-shortage"></div>
  </section>

  <section class="view" id="view-trend" role="tabpanel" aria-labelledby="tab-trend">
    <div class="hero" data-hero="trend"></div>
    <div class="story" id="story-trend"></div>
  </section>

  <div id="bootState" class="state">
    <div class="box">
      <div class="k">Connecting</div>
      <h4>Loading delivery data…</h4>
      <p>Fetching the latest day from the Delivery Status Raw pipeline.</p>
    </div>
  </div>

</main>

<footer>
  <div class="wrap">
    <span>Auto-refresh every 5 minutes</span>
    <span id="footStamp">Source: Delivery Status Raw</span>
  </div>
</footer>

<script>
/* ==================================================================
   CONFIG — the only block you normally need to touch.
   WEBAPP_URL is the Apps Script Web App deployment URL (ends in /exec)
   produced by dashboard-webapp-snippet.gs.
   ================================================================== */
const CONFIG = {
  WEBAPP_URL: "https://script.google.com/macros/s/AKfycbzrmWAPrzTarsBin-1zjqNbqiwkmg3vMxcgz1s3fDiZXPx4GU3iDoVrIo9_BZ0e76U2/exec",
  REFRESH_MS: 5 * 60 * 1000,
  CATEGORY_ORDER: ["Summary", "IQUBE", "3W"],
  SUMMARY_TAB: "Summary",
  /* The sheet carries a "Summary" tab alongside IQUBE and 3W. If Summary is a
     roll-up of the other tabs, summing every tab would double-count, so the
     headline figures are taken from Summary alone when it exists.
     Set to false if Summary is a separate product line rather than a roll-up. */
  TOTALS_FROM_SUMMARY: true,
  TOP_N: 6
};

const PALETTE = { delivered:"#2F8F5B", plan:"#26507C", pending:"#D98E2B" };

/* ---------------- helpers ---------------- */
const fmt = n => Number(n || 0).toLocaleString("en-US");
const ESC_MAP = { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" };
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ESC_MAP[c]);
const pad2 = n => String(n).padStart(2, "0");
const sum = (arr, k) => arr.reduce((a, x) => a + (Number(x[k]) || 0), 0);

function groupBy(arr, key){
  return (arr || []).reduce((acc, item) => {
    const k = item[key] == null ? "—" : String(item[key]);
    (acc[k] = acc[k] || []).push(item);
    return acc;
  }, {});
}

function orderedCats(keys){
  const order = CONFIG.CATEGORY_ORDER;
  return keys.slice().sort((a, b) => {
    const ia = order.indexOf(a), ib = order.indexOf(b);
    if (ia !== -1 && ib !== -1) return ia - ib;
    if (ia !== -1) return -1;
    if (ib !== -1) return 1;
    return a.localeCompare(b);
  });
}

/* Rows used for headline totals — see CONFIG.TOTALS_FROM_SUMMARY. */
function totalsScope(rows){
  if (!rows || !rows.length) return [];
  if (!CONFIG.TOTALS_FROM_SUMMARY) return rows;
  const s = rows.filter(r => String(r.tab) === CONFIG.SUMMARY_TAB);
  return s.length ? s : rows;
}

function shortDate(d){
  const p = String(d).split("/");
  return p.length >= 2 ? pad2(p[0]) + "/" + pad2(p[1]) : String(d);
}

/* ---------------- hero ---------------- */
const HERO_COPY = {
  status:   { kicker: "Delivery Status", head: "Where today&rsquo;s deliveries <em>actually stand</em>." },
  shortage: { kicker: "Stock Shortage",  head: "What stock is <em>holding orders back</em>." },
  trend:    { kicker: "14-Day Trend",    head: "How the line has <em>moved this fortnight</em>." }
};

function buildHero(view, data){
  const copy = HERO_COPY[view];
  const st = totalsScope(data.deliveryStatus);
  const sh = totalsScope(data.shortage);
  const delivered = sum(st, "delivered");
  const plan = sum(st, "plan");
  const pending = sum(st, "pending");
  const shortLines = sh.length;
  const shortUnits = sum(sh, "qty");
  const cats = orderedCats(Object.keys(groupBy(data.deliveryStatus, "tab")));

  return `
  <div class="wrap hero-in">
    <div class="kicker hr" style="--i:0">${copy.kicker}</div>
    <h1 class="hr" style="--i:1">${copy.head}</h1>
    <div class="hero-date hr" style="--i:2">
      Latest recorded day <b>${esc(data.asOfDate || "—")}</b>
      &nbsp;&middot;&nbsp; ${cats.length} categor${cats.length === 1 ? "y" : "ies"}: ${cats.map(esc).join(" &nbsp;/&nbsp; ")}
    </div>
    <div class="statrow">
      <div class="stat hr" style="--i:3">
        <div class="lbl">Total delivered</div>
        <div class="val g num count" data-count="${delivered}">0</div>
        <div class="sub">against ${fmt(plan)} planned</div>
      </div>
      <div class="stat hr" style="--i:4">
        <div class="lbl">Total pending</div>
        <div class="val a num count" data-count="${pending}">0</div>
        <div class="sub">awaiting despatch</div>
      </div>
      <div class="stat hr" style="--i:5">
        <div class="lbl">Shortage lines</div>
        <div class="val r num count" data-count="${shortLines}">0</div>
        <div class="sub">${fmt(shortUnits)} units short of stock</div>
      </div>
    </div>
    <div class="scrollcue hr" style="--i:6">Scroll <i></i></div>
  </div>`;
}

/* ---------------- shared chapter scaffolding ---------------- */
function chapterOpen(cat, ci, total, kicker, dark){
  return `
  <section class="chapter${dark ? " dark" : ""}">
    <div class="pin"><div class="pin-in"><div class="wrap">
      <div class="chapter-grid">
        <div class="storycol">
          <div class="kicker r" style="--i:0">
            <span class="idx">${pad2(ci + 1)}&thinsp;/&thinsp;${pad2(total)}</span> ${kicker}
          </div>
          <h2 class="r" style="--i:1">${esc(cat)}</h2>`;
}

function chapterMid(){ return `</div><div class="datacol">`; }
function chapterClose(){ return `</div></div></div></div></div></section>`; }

function ledger(title, tag, head, body){
  return `
  <div class="ledger"><div class="wrap">
    <div class="ledger-head"><h3>${title}</h3><span class="tag">${tag}</span></div>
    <div class="tablescroll">
      <table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>
    </div>
  </div></div>`;
}

function emptyStory(msg){
  return `<div class="ledger"><div class="wrap"><div class="empty">${esc(msg)}</div></div></div>`;
}

/* ---------------- story 1: Delivery Status ---------------- */
function buildStatusStory(data){
  const groups = groupBy(data.deliveryStatus, "tab");
  const cats = orderedCats(Object.keys(groups));
  if (!cats.length) return emptyStory("No delivery status rows recorded for the latest day.");

  return cats.map((cat, ci) => {
    const rows = groups[cat].slice().sort((a, b) => (b.pending - a.pending) || (b.plan - a.plan));
    const delivered = sum(rows, "delivered");
    const plan = sum(rows, "plan");
    const pending = sum(rows, "pending");
    const pct = plan > 0 ? Math.round((delivered / plan) * 100) : 0;
    const top = rows.slice(0, CONFIG.TOP_N);
    const scale = Math.max(1, ...rows.map(r => Math.max(Number(r.plan) || 0, Number(r.delivered) || 0)));

    const lines = top.map((r, i) => {
      const dw = Math.min(100, ((Number(r.delivered) || 0) / scale) * 100);
      const pw = Math.min(100, ((Number(r.plan) || 0) / scale) * 100);
      return `
        <div class="linerow">
          <div class="name r" style="--i:${4 + i}">
            <span class="m">${esc(r.model)}</span><span class="c">${esc(r.color)}</span>
          </div>
          <div class="bar" title="Delivered ${fmt(r.delivered)} of plan ${fmt(r.plan)}">
            <span class="r no-shift" style="--i:${4 + i};--w:${pw.toFixed(1)};--c:rgba(38,80,124,.28)"></span>
            <span class="r no-shift" style="--i:${4.4 + i};--w:${dw.toFixed(1)};--c:${PALETTE.delivered}"></span>
          </div>
          <div class="qty num a r" style="--i:${4 + i}">${fmt(r.pending)}</div>
        </div>`;
    }).join("");

    const rest = rows.length - top.length;
    const extra = rest > 0
      ? `<div class="more-note r" style="--i:${4 + top.length}">+ ${rest} further line${rest === 1 ? "" : "s"} in the table below</div>`
      : "";

    const body = rows.map(r => `
      <tr>
        <td>${esc(r.model)}</td>
        <td class="dim">${esc(r.color)}</td>
        <td class="n g num">${fmt(r.delivered)}</td>
        <td class="n num">${fmt(r.plan)}</td>
        <td class="n a num">${fmt(r.pending)}</td>
      </tr>`).join("");

    return chapterOpen(cat, ci, cats.length, "Delivery Status", ci % 2 === 1) + `
      <p class="lede r" style="--i:2">${rows.length} model / colour line${rows.length === 1 ? "" : "s"} tracked on ${esc(data.asOfDate || "the latest day")}.</p>
      <div class="kpis">
        <div class="kpi r" style="--i:3"><div class="lbl">Delivered</div>
          <div class="val g num count" data-count="${delivered}">0</div><div class="foot">units despatched</div></div>
        <div class="kpi r" style="--i:3.6"><div class="lbl">Plan</div>
          <div class="val num count" data-count="${plan}">0</div><div class="foot">units scheduled</div></div>
        <div class="kpi r" style="--i:4.2"><div class="lbl">Pending</div>
          <div class="val a num count" data-count="${pending}">0</div><div class="foot">still to go</div></div>
      </div>
      <div class="meter r" style="--i:5">
        <div class="meter-head"><span>Plan completion</span><span class="pct num">${pct}%</span></div>
        <div class="meter-track">
          <div class="meter-fill r no-shift${pct > 100 ? " over" : ""}" style="--i:5.5;--w:${Math.min(100, pct)}"></div>
        </div>
      </div>`
      + chapterMid() + `
      <div class="datacol-head r" style="--i:3">
        <span>Top ${top.length} by pending</span><span>Delivered vs plan</span>
      </div>
      ${lines}${extra}`
      + chapterClose()
      + ledger(esc(cat) + " &mdash; full delivery lines", fmt(rows.length) + " lines",
          `<th>Model</th><th>Colour</th><th class="n">Delivered</th><th class="n">Plan</th><th class="n">Pending</th>`,
          body);
  }).join("");
}

/* ---------------- story 2: Shortage ---------------- */
function buildShortageStory(data){
  const groups = groupBy(data.shortage, "tab");
  const cats = orderedCats(Object.keys(groups));
  if (!cats.length) return emptyStory("No stock shortages recorded for the latest day.");

  return cats.map((cat, ci) => {
    const rows = groups[cat].slice().sort((a, b) => b.qty - a.qty);
    const units = sum(rows, "qty");
    const worst = rows[0] || { qty: 0, model: "—", color: "" };
    const scale = Math.max(1, ...rows.map(r => Number(r.qty) || 0));
    const top = rows.slice(0, CONFIG.TOP_N);

    const severity = q => q >= scale * 0.66 ? "#C0392B" : (q >= scale * 0.33 ? "#D98E2B" : "#E0B267");

    const lines = top.map((r, i) => {
      const w = Math.max(4, ((Number(r.qty) || 0) / scale) * 100);
      return `
        <div class="linerow">
          <div class="name r" style="--i:${4 + i}">
            <span class="m">${esc(r.model)}</span><span class="c">${esc(r.color)}</span>
          </div>
          <div class="bar">
            <span class="r no-shift" style="--i:${4 + i};--w:${w.toFixed(1)};--c:${severity(Number(r.qty) || 0)}"></span>
          </div>
          <div class="qty num r" style="--i:${4 + i}">${fmt(r.qty)}</div>
        </div>`;
    }).join("");

    const rest = rows.length - top.length;
    const extra = rest > 0
      ? `<div class="more-note r" style="--i:${4 + top.length}">+ ${rest} further short line${rest === 1 ? "" : "s"} in the table below</div>`
      : "";

    const body = rows.map(r => `
      <tr>
        <td>${esc(r.model)}</td>
        <td class="dim">${esc(r.color)}</td>
        <td class="n r num">${fmt(r.qty)}</td>
      </tr>`).join("");

    return chapterOpen(cat, ci, cats.length, "Stock Shortage", ci % 2 === 1) + `
      <p class="lede r" style="--i:2">${rows.length} line${rows.length === 1 ? "" : "s"} cannot be covered from stock against open delivery orders.</p>
      <div class="kpis">
        <div class="kpi r" style="--i:3"><div class="lbl">Units short</div>
          <div class="val r num count" data-count="${units}">0</div><div class="foot">across the category</div></div>
        <div class="kpi r" style="--i:3.6"><div class="lbl">Lines affected</div>
          <div class="val a num count" data-count="${rows.length}">0</div><div class="foot">model / colour</div></div>
        <div class="kpi r" style="--i:4.2"><div class="lbl">Worst line</div>
          <div class="val num count" data-count="${worst.qty}">0</div><div class="foot">${esc(worst.model)}</div></div>
      </div>`
      + chapterMid() + `
      <div class="datacol-head r" style="--i:3">
        <span>Top ${top.length} by shortfall</span><span>Units short</span>
      </div>
      ${lines}${extra}`
      + chapterClose()
      + ledger(esc(cat) + " &mdash; full shortage list", fmt(rows.length) + " lines",
          `<th>Model</th><th>Colour</th><th class="n">Units short</th>`,
          body);
  }).join("");
}

/* ---------------- story 3: Trend ---------------- */
function niceMax(v){
  if (!(v > 0)) return 10;
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v / mag;
  const step = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
  return step * mag;
}

function trendChart(dates, series){
  const W = 780, H = 280, pl = 54, pr = 18, pt = 18, pb = 36;
  const iw = W - pl - pr, ih = H - pt - pb;
  const n = dates.length;
  let peak = 1;
  series.forEach(s => s.values.forEach(v => { if (v > peak) peak = v; }));
  const max = niceMax(peak);
  const X = i => n < 2 ? pl + iw / 2 : pl + i * (iw / (n - 1));
  const Y = v => pt + ih - (Math.max(0, Math.min(max, v)) / max) * ih;

  let grid = "";
  [0, 0.25, 0.5, 0.75, 1].forEach(t => {
    const y = (pt + ih - t * ih).toFixed(1);
    grid += `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}"/>`;
    grid += `<text class="axlbl" x="${pl - 10}" y="${y}" text-anchor="end" dominant-baseline="middle">${fmt(Math.round(max * t))}</text>`;
  });

  const idxs = n <= 3 ? dates.map((d, i) => i) : [0, Math.floor((n - 1) / 2), n - 1];
  let xlbl = "";
  idxs.forEach(i => {
    const anchor = i === 0 ? "start" : (i === n - 1 ? "end" : "middle");
    xlbl += `<text class="axlbl" x="${X(i).toFixed(1)}" y="${H - pb + 20}" text-anchor="${anchor}">${esc(shortDate(dates[i]))}</text>`;
  });

  let area = "", paths = "", tips = "";
  series.forEach((s, si) => {
    const pts = s.values.map((v, i) => X(i).toFixed(1) + "," + Y(v).toFixed(1)).join(" ");
    if (s.key === "delivered" && n > 1){
      area = `<polygon class="area r no-shift" style="--i:1" fill="${s.color}" points="${pl},${(pt + ih).toFixed(1)} ${pts} ${(W - pr).toFixed(1)},${(pt + ih).toFixed(1)}"/>`;
    }
    paths += `<polyline class="spark r slow no-shift" style="--i:${si}" stroke="${s.color}" points="${pts}"/>`;
    const li = n - 1;
    tips += `<circle class="tip r late no-shift" style="--i:${si}" cx="${X(li).toFixed(1)}" cy="${Y(s.values[li]).toFixed(1)}" r="3.5" fill="${s.color}"/>`;
  });

  return `<svg class="trend" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img"
    aria-label="Delivered, plan and pending over the last ${n} recorded days">${grid}${area}${paths}${tips}${xlbl}</svg>`;
}

function buildTrendStory(data){
  const groups = groupBy(data.trend, "tab");
  const cats = orderedCats(Object.keys(groups));
  if (!cats.length) return emptyStory("Not enough trend history recorded yet.");

  return cats.map((cat, ci) => {
    const rows = groups[cat].slice();
    const dates = rows.map(r => r.date);
    const delivered = rows.map(r => Number(r.delivered) || 0);
    const plan = rows.map(r => Number(r.plan) || 0);
    const pending = rows.map(r => Number(r.pending) || 0);
    const latest = delivered.length ? delivered[delivered.length - 1] : 0;
    const avg = delivered.length ? Math.round(delivered.reduce((a, b) => a + b, 0) / delivered.length) : 0;
    const best = delivered.length ? Math.max.apply(null, delivered) : 0;
    const delta = avg > 0 ? Math.round(((latest - avg) / avg) * 100) : 0;
    const deltaTxt = delta === 0 ? "level with" : (delta > 0 ? "+" + delta + "% above" : delta + "% below");

    const series = [
      { key:"delivered", label:"Delivered", color:PALETTE.delivered, values:delivered },
      { key:"plan",      label:"Plan",      color:PALETTE.plan,      values:plan },
      { key:"pending",   label:"Pending",   color:PALETTE.pending,   values:pending }
    ];

    const body = rows.slice().reverse().map(r => `
      <tr>
        <td>${esc(r.date)}</td>
        <td class="n g num">${fmt(r.delivered)}</td>
        <td class="n num">${fmt(r.plan)}</td>
        <td class="n a num">${fmt(r.pending)}</td>
      </tr>`).join("");

    return chapterOpen(cat, ci, cats.length, "14-Day Trend", ci % 2 === 1) + `
      <p class="lede r" style="--i:2">${dates.length} recorded day${dates.length === 1 ? "" : "s"}, ${esc(shortDate(dates[0]))} to ${esc(shortDate(dates[dates.length - 1]))}. The latest day sits ${deltaTxt} the period average.</p>
      <div class="kpis">
        <div class="kpi r" style="--i:3"><div class="lbl">Latest day</div>
          <div class="val g num count" data-count="${latest}">0</div><div class="foot">delivered</div></div>
        <div class="kpi r" style="--i:3.6"><div class="lbl">Period average</div>
          <div class="val num count" data-count="${avg}">0</div><div class="foot">per day</div></div>
        <div class="kpi r" style="--i:4.2"><div class="lbl">Best day</div>
          <div class="val a num count" data-count="${best}">0</div><div class="foot">peak despatch</div></div>
      </div>`
      + chapterMid() + `
      <div class="legend r" style="--i:3">
        <span><i style="background:${PALETTE.delivered}"></i>Delivered</span>
        <span><i style="background:${PALETTE.plan}"></i>Plan</span>
        <span><i style="background:${PALETTE.pending}"></i>Pending</span>
      </div>
      ${trendChart(dates, series)}`
      + chapterClose()
      + ledger(esc(cat) + " &mdash; daily history", fmt(rows.length) + " days",
          `<th>Date</th><th class="n">Delivered</th><th class="n">Plan</th><th class="n">Pending</th>`,
          body);
  }).join("");
}

/* ==================================================================
   ANIMATION ENGINE
   Preferred path: native CSS scroll-driven animations (animation-timeline).
   Fallback path : IntersectionObserver scroll-reveal driving the same --r.
   Numbers count up via requestAnimationFrame in both paths so that they
   stay thousands-separated (CSS counters cannot format separators).
   ================================================================== */
const ROOT = document.documentElement;
const NATIVE  = typeof CSS !== "undefined" && !!CSS.supports && CSS.supports("animation-timeline", "view()");
const HAS_PROP = typeof CSS !== "undefined" && "registerProperty" in CSS;
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

if (!NATIVE) ROOT.classList.add("fallback");
if (!HAS_PROP) ROOT.classList.add("no-anim");
document.body.classList.add("booting");

function measureChrome(){
  const m = document.querySelector(".masthead");
  const t = document.querySelector(".tabrail");
  if (!m || !t) return;
  const mh = Math.round(m.getBoundingClientRect().height);
  const th = Math.round(t.getBoundingClientRect().height);
  ROOT.style.setProperty("--mast", mh + "px");
  ROOT.style.setProperty("--chrome", (mh + th) + "px");
}

/* ---- count-up ---- */
function countUp(el){
  const target = Number(el.dataset.count) || 0;
  if (REDUCED || !HAS_PROP || target === 0){ el.textContent = fmt(target); return; }
  const dur = 1150;
  let t0 = null;
  const ease = t => 1 - Math.pow(1 - t, 3);
  function step(ts){
    if (t0 === null) t0 = ts;
    const p = Math.min(1, (ts - t0) / dur);
    el.textContent = fmt(Math.round(target * ease(p)));
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ---- observers ---- */
let countObs = null, revealObs = null;

function initObservers(){
  if (countObs) countObs.disconnect();
  if (revealObs) revealObs.disconnect();

  countObs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      countObs.unobserve(e.target);
      countUp(e.target);
    });
  }, { threshold: 0.2 });

  if (!NATIVE && !REDUCED && HAS_PROP){
    revealObs = new IntersectionObserver(entries => {
      entries.forEach(e => {
        /* reveal on entry, and immediately for anything already scrolled past */
        if (e.isIntersecting || e.boundingClientRect.top < 0){
          e.target.classList.add("in");
          revealObs.unobserve(e.target);
        }
      });
    }, { rootMargin: "0px 0px -10% 0px", threshold: 0.05 });
  }
}

function observeAll(scope){
  scope.querySelectorAll("[data-count]").forEach(el => countObs.observe(el));
  if (revealObs) scope.querySelectorAll(".r").forEach(el => revealObs.observe(el));
}

/* polyline lengths feed the stroke-dashoffset draw-in */
function measureSparks(){
  document.querySelectorAll("svg.trend .spark").forEach(p => {
    let L = 0;
    try { L = p.getTotalLength(); } catch (err) { L = 0; }
    p.style.setProperty("--len", (L || 2000).toFixed(1));
  });
}

/* ---- hero entrance (time-based; heroes sit outside any chapter timeline) ---- */
function playHero(view){
  const hero = document.querySelector('.hero[data-hero="' + view + '"]');
  if (!hero) return;
  const els = hero.querySelectorAll(".hr");
  els.forEach(e => e.classList.remove("in"));
  void hero.offsetWidth;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    els.forEach(e => e.classList.add("in"));
  }));
}

/* ---- tabs ---- */
const TABS = Array.prototype.slice.call(document.querySelectorAll(".tabbtn"));
let current = "status";

function activate(view, moveFocus){
  current = view;
  TABS.forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === view)));
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === "view-" + view));
  window.scrollTo(0, 0);
  playHero(view);
  if (moveFocus){
    const btn = TABS.filter(b => b.dataset.view === view)[0];
    if (btn) btn.focus();
  }
}

TABS.forEach(b => b.addEventListener("click", () => activate(b.dataset.view)));
document.querySelector(".tabrail-in").addEventListener("keydown", e => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  e.preventDefault();
  const i = TABS.map(b => b.dataset.view).indexOf(current);
  const j = e.key === "ArrowRight" ? (i + 1) % TABS.length : (i - 1 + TABS.length) % TABS.length;
  activate(TABS[j].dataset.view, true);
});

/* ---- status badge + states ---- */
function setLive(state){
  const b = document.getElementById("liveBadge");
  const t = document.getElementById("liveTxt");
  b.classList.remove("stale", "err");
  if (state === "ok"){ t.textContent = "Live"; }
  else if (state === "stale"){ b.classList.add("stale"); t.textContent = "Stale"; }
  else { b.classList.add("err"); t.textContent = "Offline"; }
}

function showState(kicker, title, msg, code){
  document.body.classList.add("booting");
  document.getElementById("bootState").innerHTML =
    '<div class="box"><div class="k">' + esc(kicker) + '</div><h4>' + esc(title) + '</h4>' +
    '<p>' + esc(msg) + '</p>' + (code ? '<code>' + esc(code) + '</code>' : '') + '</div>';
}

/* ---- render ---- */
function renderAll(data){
  const wasBooting = document.body.classList.contains("booting");
  const y = window.scrollY;

  ["status", "shortage", "trend"].forEach(v => {
    const hero = document.querySelector('.hero[data-hero="' + v + '"]');
    if (hero) hero.innerHTML = buildHero(v, data);
  });
  document.getElementById("story-status").innerHTML   = buildStatusStory(data);
  document.getElementById("story-shortage").innerHTML = buildShortageStory(data);
  document.getElementById("story-trend").innerHTML    = buildTrendStory(data);

  document.getElementById("asOfDate").textContent = data.asOfDate || "—";
  document.getElementById("footStamp").textContent = data.generatedAt
    ? "Generated " + new Date(data.generatedAt).toLocaleString()
    : "Source: Delivery Status Raw";

  document.body.classList.remove("booting");
  measureChrome();
  measureSparks();
  initObservers();
  observeAll(document);
  playHero(current);

  /* a background refresh should not yank the reader back to the top */
  if (!wasBooting) window.scrollTo(0, y);
}

/* ---- fetch loop ---- */
let lastSig = null;

const DEMO_MODE = /[?&]demo=1/.test(window.location.search);

async function load(){
  if (DEMO_MODE){
    const b = document.getElementById("liveBadge");
    b.classList.add("demo");
    document.getElementById("liveTxt").textContent = "Demo data";
    if (lastSig === null){ lastSig = "demo"; renderAll(DEMO_DATA); }
    return;
  }
  if (!CONFIG.WEBAPP_URL || CONFIG.WEBAPP_URL.indexOf("PASTE_") === 0){
    setLive("err");
    showState("Setup required", "Web App URL not set",
      "Open index.html and replace WEBAPP_URL in the CONFIG block with the Apps Script deployment URL for this sheet (it ends in /exec). To preview the layout with sample figures, add ?demo=1 to this page's address.",
      'WEBAPP_URL: "https://script.google.com/macros/s/AKfy.../exec"');
    return;
  }
  try {
    const res = await fetch(CONFIG.WEBAPP_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    setLive("ok");
    const sig = JSON.stringify([data.asOfDate, data.deliveryStatus, data.shortage, data.trend]);
    if (sig === lastSig) return;   /* unchanged: leave the page alone */
    lastSig = sig;
    renderAll(data);
  } catch (err){
    setLive("err");
    if (!lastSig){
      showState("Connection failed", "Could not load delivery data",
        'The dashboard could not reach the Apps Script Web App. Check that the deployment is still active and set to "Anyone" access, and that the URL in CONFIG is the current one.',
        String(err));
    }
  }
}

/* ---- boot ---- */
measureChrome();
window.addEventListener("resize", measureChrome, { passive: true });
if ("ResizeObserver" in window){
  new ResizeObserver(measureChrome).observe(document.querySelector(".masthead"));
}
load();
setInterval(load, CONFIG.REFRESH_MS);
</script>
